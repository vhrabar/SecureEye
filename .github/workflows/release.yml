name: Release

# Single entry point for a release:
#
#   test  ->  verify deb / rpm / arch build and install  ->  publish
#
on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (defaults to the latest tag). No leading v."
        required: false
        type: string
      publish:
        description: "Also publish to Launchpad, COPR and the AUR."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

env:
  FEDORA_IMAGE: fedora:44
  ARCH_IMAGE: archlinux:base-devel
  UBUNTU_IMAGE: ubuntu:26.04

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version
        id: ver
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="$RELEASE_TAG"
            version="${tag#v}"
            publish=true
          else
            version="${INPUT_VERSION:-$(git describe --tags --abbrev=0 | sed 's/^v//')}"
            tag="v${version}"
            publish="${{ inputs.publish }}"
          fi
          case "$version" in
            [0-9]*) ;;
            *) echo "::error::Refusing to build version '$version' (must start with a digit)."; exit 1 ;;
          esac
          # A pre-release tag cannot be spelled the same way in all three
          # formats: rpm and deb want 1.0.0~rc1, Arch's pkgver allows neither
          # '-' nor '~', and the PKGBUILD derives its source URL from pkgver.
          # Rather than publish three versions that sort differently, refuse.
          case "$version" in
            *-*) echo "::error::Pre-release tag '$tag' is not publishable: rpm/deb/Arch cannot represent '-' consistently. Tag a plain X.Y.Z release."; exit 1 ;;
          esac
          if [ "$publish" = "true" ]; then
            branch="${{ github.event.repository.default_branch }}"

            git fetch --no-tags origin "+refs/heads/${branch}:refs/remotes/origin/${branch}"
            git fetch origin "+refs/tags/${tag}:refs/tags/${tag}"
            tag_sha="$(git rev-parse "refs/tags/${tag}^{commit}")"
            head_sha="$(git rev-parse "refs/remotes/origin/${branch}")"
            if [ "$tag_sha" != "$head_sha" ]; then
              echo "::error::${tag} is at ${tag_sha}, but ${branch} is at ${head_sha}. The tag must be on ${branch} HEAD, otherwise COPR builds a different commit than the PPA and AUR. Move the tag to HEAD, or reset ${branch} to the tag, then re-run."
              exit 1
            fi
            echo "$tag is on $branch HEAD ($tag_sha)"
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "### secure-eye \`$version\` (tag \`$tag\`, publish: \`$publish\`)" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Ruff
        run: uv run --no-sync ruff check .

      - name: Black
        run: uv run --no-sync black --check .

      - name: Pytest
        run: uv run pytest tests/ -v

  verify-deb:
    name: Verify deb (${{ matrix.name }})
    needs: [ version, test ]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: amd64
            runner: ubuntu-24.04
          - name: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debhelper devscripts dpkg-dev build-essential fakeroot lintian \
            meson ninja-build pkg-config \
            libpam0g-dev libevdev-dev libinih-dev python3

      - name: Set packaging version to ${{ needs.version.outputs.version }}
        run: scripts/set-package-version.sh "${{ needs.version.outputs.version }}"

      - name: Stage debian/ at the source root
        run: |
          cp -r secureEye/debian ./debian
          rm -rf secureEye/debian

      - name: Build packages
        run: dpkg-buildpackage -b -us -uc

      # dpkg-buildpackage writes the artifacts to the parent directory.
      - name: Collect artifacts
        run: |
          mkdir -p dist
          mv ../*.deb ../*.ddeb dist/ 2>/dev/null || true
          ls -la dist

      - name: Lintian
        run: lintian --fail-on error --tag-display-limit 0 dist/*.deb

      - name: Install smoke test
        run: |
          docker run --rm -v "$PWD/dist:/debs:ro" "$UBUNTU_IMAGE" bash -euc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends software-properties-common
            # Recognition backends (python3-mediapipe, python3-dlib) live here.
            add-apt-repository -y ppa:vhrabar/tools
            apt-get install -y --no-install-recommends /debs/secure-eye_*.deb
            dpkg -s secure-eye | grep -q "^Status: install ok installed"
            # The split packages were merged away; nothing must resurrect them.
            dpkg -s libpam-secureeye 2>/dev/null && { echo "libpam-secureeye reappeared"; exit 1; }
            test -f /usr/lib/systemd/system/secureeye-authd.service
            ls /usr/lib/*/security/pam_secureEye.so
            test -x /usr/bin/secureEye
            test -f /etc/secureEye/config.ini
            echo "deb install smoke test passed."
          '

      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  verify-rpm:
    name: Verify rpm (${{ matrix.name }})
    needs: [ version, test ]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            runner: ubuntu-24.04
          - name: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # build-rpm.sh generates the changelogs from CHANGELOG.md and commits them
      # locally itself, the same way COPR's .copr/Makefile does.
      - name: Build packages (Fedora container)
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$FEDORA_IMAGE" \
            env PKG_VERSION="${{ needs.version.outputs.version }}" \
                MARCH="" REL_SUFFIX="" \
            bash scripts/build-rpm.sh

      - name: Install smoke test
        run: |
          docker run --rm -v "$PWD/dist:/rpms:ro" "$FEDORA_IMAGE" bash -euc '
            dnf_opts="--setopt=timeout=180 --setopt=retries=10 --setopt=minrate=0"
            dnf install -y $dnf_opts dnf-plugins-core
            # Recognition backends (python3-mediapipe on x86_64, python3-dlib).
            dnf copr enable -y vhrabar/python-extras
            dnf install -y $dnf_opts /rpms/*.rpm
            rpm -q secure-eye
            rpm -q libpam-secureeye && { echo "libpam-secureeye reappeared"; exit 1; }
            id secureeye
            test -f /usr/lib/systemd/system/secureeye-authd.service
            ls /usr/lib64/security/pam_secureEye.so
            test -x /usr/bin/secureEye
            test -f /etc/secureEye/config.ini
            echo "rpm install smoke test passed."
          '

      - uses: actions/upload-artifact@v7
        with:
          name: rpm-${{ matrix.name }}
          path: dist/*.rpm
          if-no-files-found: error
          retention-days: 7

  verify-arch:
    name: Verify arch pkg (x86_64)
    needs: [ version, test ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Stage a build tree
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p archbuild
          cp secureEye/archlinux/secureEye/PKGBUILD \
             secureEye/archlinux/secureEye/secure-eye.install \
             secureEye/archlinux/secureEye/.SRCINFO archbuild/
          git archive --format=tar.gz --prefix="SecureEye-${VERSION}/" \
            -o "archbuild/secure-eye-${VERSION}.tar.gz" HEAD

      - name: Build and install (Arch container)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e VERSION "$ARCH_IMAGE" bash -euxc '
            pacman -Syu --noconfirm --needed \
              base-devel meson ninja pkgconf pam libevdev libinih git pacman-contrib
            useradd -m builder
            chown -R builder /src/archbuild
            su builder -c "
              set -eux
              cd /src/archbuild
              sed -i -E \"s/^pkgver=.*/pkgver=$VERSION/;s/^pkgrel=.*/pkgrel=1/\" PKGBUILD
              updpkgsums
              makepkg --nodeps --noconfirm
              makepkg --printsrcinfo > .SRCINFO.generated
            "
            pacman -U --noconfirm -dd "/src/archbuild/secure-eye-$VERSION-1-"*.pkg.tar.zst
            pacman -Qi secure-eye
            test -f /usr/lib/systemd/system/secureeye-authd.service
            ls /usr/lib/security/pam_secureEye.so
            test -x /usr/bin/secureEye
            test -f /etc/secureEye/config.ini
            test -f /usr/lib/sysusers.d/secure-eye.conf
            echo "arch install smoke test passed."
          '

      - name: Check .SRCINFO is in sync with PKGBUILD
        run: |
          filter() { grep -vE '^\s*(pkgver|sha256sums|source) =' "$1"; }
          if ! diff -u <(filter archbuild/.SRCINFO) <(filter archbuild/.SRCINFO.generated); then
            echo "::error::.SRCINFO is stale — run 'makepkg --printsrcinfo > .SRCINFO' in secureEye/archlinux/secureEye/"
            exit 1
          fi
          echo ".SRCINFO is in sync."

      - uses: actions/upload-artifact@v7
        with:
          name: arch-x86_64
          path: archbuild/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7

  publish-ppa:
    name: Publish to Launchpad PPA
    needs: [ version, test, verify-deb, verify-rpm, verify-arch ]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: launchpad-ppa
      url: https://launchpad.net/~vhrabar/+archive/ubuntu/tools
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      # debian/changelog is generated from CHANGELOG.md, not stored, so render
      # it here. Deterministic, so this matches what CI verified and what COPR
      # produces for the same commit.
      - name: Generate packaging for ${{ needs.version.outputs.version }}
        run: scripts/set-package-version.sh "${{ needs.version.outputs.version }}"

      - name: Publish to Launchpad PPA
        run: bash scripts/publish-ppa.sh
        env:
          REPOSITORY: "vhrabar/tools"
          GPG_PRIVATE_KEY: ${{ secrets.PPA_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.PPA_GPG_PASSPHRASE }}
          DEBEMAIL: "vedran.hrabar@outlook.com"
          DEBFULLNAME: "Vedran Hrabar"

          DEBIAN_DIR: "secureEye/debian"
          SERIES: "questing resolute stonking"

          NEW_VERSION_TEMPLATE: "{VERSION}~{SERIES}{REVISION}"

          # The tag's tarball. debian/ is rendered from CHANGELOG.md above and
          # handed to the build via DEBIAN_DIR, so it need not be in the tarball.
          TARBALL: "https://github.com/${{ github.repository }}/archive/refs/tags/${{ needs.version.outputs.tag }}.tar.gz"

  publish-copr:
    name: Build on COPR
    needs: [ version, test, verify-deb, verify-rpm, verify-arch ]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    container: fedora:44
    environment:
      name: copr
      url: https://copr.fedorainfracloud.org/coprs/vhrabar/SecureEye/
    steps:
      - name: Install copr-cli
        run: dnf install -y --setopt=install_weak_deps=False copr-cli

      # An API build pinned to the tag, rather than the custom webhook. The
      # webhook rebuilds the package from its stored SCM config, whose
      # committish is unset, so COPR would clone the default branch's HEAD and
      # could build a different commit than the PPA and the AUR.
      - name: Submit an SCM build for ${{ needs.version.outputs.tag }}
        env:
          COPR_CONFIG_CONTENT: ${{ secrets.COPR_CONFIG }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${COPR_CONFIG_CONTENT:-}" ]; then
            echo "::error::COPR_CONFIG secret is not set. Copy the token file from https://copr.fedorainfracloud.org/api/ into it."
            exit 1
          fi
          mkdir -p ~/.config
          printf '%s\n' "$COPR_CONFIG_CONTENT" > ~/.config/copr
          chmod 600 ~/.config/copr
          grep -q '^\[copr-cli\]' ~/.config/copr \
            || { echo "::error::COPR_CONFIG does not look like a copr-cli token file (no [copr-cli] section)."; exit 1; }

          # --method make_srpm runs .copr/Makefile, which regenerates the
          # changelogs from CHANGELOG.md for this exact commit.
          copr-cli buildscm \
            --clone-url "https://github.com/${{ github.repository }}" \
            --commit "$TAG" \
            --method make_srpm \
            --nowait \
            vhrabar/SecureEye


  publish-aur:
    name: Publish to the AUR
    needs: [ version, test, verify-deb, verify-rpm, verify-arch ]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: aur
      url: https://aur.archlinux.org/packages/secure-eye
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      # The tag is never moved, so archive/refs/tags/<tag>.tar.gz is stable and
      # updpkgsums hashes exactly what users download. These sums are valid only
      # in the AUR copy: in-tree they would have to hash an archive containing
      # themselves, which has no fixed point.
      - name: Set pkgver and checksum the released tarball
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e VERSION "$ARCH_IMAGE" bash -euxc '
            pacman -Syu --noconfirm --needed base-devel pacman-contrib
            useradd -m builder && chown -R builder /src
            su builder -c "
              set -eux
              cd /src
              scripts/set-package-version.sh $VERSION
              cd secureEye/archlinux/secureEye
              updpkgsums
              makepkg --printsrcinfo > .SRCINFO
            "
          '
          sudo chown -R "$(id -u):$(id -g)" .
          grep -qE "^[[:space:]]*pkgver = ${VERSION}$" secureEye/archlinux/secureEye/.SRCINFO
          git diff --stat

      - name: Push to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            echo "::error::AUR_SSH_PRIVATE_KEY secret is not set."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t rsa,ed25519 aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"

          git clone ssh://aur@aur.archlinux.org/secure-eye.git /tmp/aur
          cp secureEye/archlinux/secureEye/PKGBUILD \
             secureEye/archlinux/secureEye/.SRCINFO \
             secureEye/archlinux/secureEye/secure-eye.install \
             /tmp/aur/

          git -C /tmp/aur config user.name "Vedran Hrabar"
          git -C /tmp/aur config user.email "vedran.hrabar@outlook.com"
          git -C /tmp/aur add -A
          if git -C /tmp/aur diff --cached --quiet; then
            echo "AUR is already at ${VERSION}; nothing to push."
          else
            git -C /tmp/aur commit -m "Update to ${VERSION}"
            # HEAD:master, not master: secure-eye does not exist on the AUR
            # yet, so the first clone is of an empty repo and the local branch
            # name comes from init.defaultBranch. Where that is "main", a bare
            # "push origin master" fails with "src refspec master does not
            # match any". HEAD:master is correct either way.
            git -C /tmp/aur push origin HEAD:master
            echo "Pushed secure-eye ${VERSION} to the AUR."
          fi
