name: Publish to Launchpad PPA

on:
  workflow_run:
    workflows: [ "Build Debian packages" ]
    types: [ completed ]

permissions:
  contents: read

concurrency:
  group: publish-ppa-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish source packages to PPA
    # Only for release-triggered, successful runs of the deb build.
    if: >-
      github.event.workflow_run.event == 'release' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04

    environment:
      name: launchpad-ppa
      url: https://launchpad.net/~vhrabar/+archive/ubuntu/tools
    steps:
      - name: Check out the released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Publish to Launchpad PPA
        run: bash scripts/publish-ppa.sh
        env:
          REPOSITORY: "vhrabar/tools"
          GPG_PRIVATE_KEY: ${{ secrets.PPA_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.PPA_GPG_PASSPHRASE }}
          DEBEMAIL: "vedran.hrabar@outlook.com"
          DEBFULLNAME: "Vedran Hrabar"

          DEBIAN_DIR: "secureEye/debian"
          SERIES: "questing resolute"

          NEW_VERSION_TEMPLATE: "{VERSION}~{SERIES}{REVISION}"

          # GitHub's auto-generated source tarball for the released tag.
          TARBALL: "https://github.com/${{ github.repository }}/archive/refs/tags/${{ github.event.workflow_run.head_branch }}.tar.gz"