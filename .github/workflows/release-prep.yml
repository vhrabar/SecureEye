name: Prepare release

# Automates the manual part of cutting a release:
#
#   patch versions -> commit to the default branch -> tag it -> draft a release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.4 (no leading v)."
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-prep
  cancel-in-progress: false

env:
  DEV_BRANCH: dev

jobs:
  prepare:
    name: Prepare ${{ inputs.version }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Validate the version and check the tag is free
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$VERSION" in
            [0-9]*) ;;
            *) echo "::error::Version '$VERSION' must start with a digit."; exit 1 ;;
          esac
          # Same rule release.yml enforces: rpm and deb want 1.0.0~rc1, Arch's
          # pkgver allows neither '-' nor '~'.
          case "$VERSION" in
            *-*) echo "::error::'$VERSION' is a pre-release. rpm/deb/Arch cannot represent '-' consistently; use a plain X.Y.Z."; exit 1 ;;
          esac
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::Tag v${VERSION} already exists. Pick another version, or delete the tag first."
            exit 1
          fi
          echo "v${VERSION} is free."

      - name: Require notes under [Unreleased]
        run: |
          set -euo pipefail
          if ! scripts/changelog-section.sh Unreleased >/dev/null 2>&1; then
            echo "::error::CHANGELOG.md has no content under '## [Unreleased]'. Add the release notes first."
            exit 1
          fi
          echo "Notes found under [Unreleased]:"
          scripts/changelog-section.sh Unreleased

      - name: Patch versions and date the changelog section
        env:
          VERSION: ${{ inputs.version }}
          DEBEMAIL: "vedran.hrabar@outlook.com"
          DEBFULLNAME: "Vedran Hrabar"
        run: scripts/set-package-version.sh "$VERSION"

      - name: Commit and tag
        id: commit
        env:
          VERSION: ${{ inputs.version }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::error::Nothing changed; is CHANGELOG.md already at ${VERSION}?"
            exit 1
          fi
          git commit -m "chore(release): ${VERSION}"

          # Push the commit before tagging so the tag lands on the branch HEAD.
          git push origin "HEAD:${BRANCH}"
          git tag -a "v${VERSION}" -m "SecureEye ${VERSION}"
          git push origin "refs/tags/v${VERSION}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Draft the release from CHANGELOG.md
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scripts/changelog-section.sh "$VERSION" > /tmp/notes.md
          gh release create "v${VERSION}" \
            --draft \
            --title "SecureEye ${VERSION}" \
            --notes-file /tmp/notes.md \
            --target "${{ steps.commit.outputs.sha }}"
          url="$(gh release view "v${VERSION}" --json url --jq .url)"
          {
            echo "### Draft release for \`${VERSION}\` is ready"
            echo ""
            echo "Review it, then press **Publish** to start the release: $url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Back-merge the release commit into the integration branch
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
          BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          open_pr() {
            local sha=$1 reason=$2 head="chore/backmerge-v${VERSION}" url
            git push -f origin "${sha}:refs/heads/${head}"
            gh pr create \
              --base "$DEV_BRANCH" \
              --head "$head" \
              --title "chore: back-merge ${VERSION} into ${DEV_BRANCH}" \
              --body "$(printf '%s\n\n%s\n' \
                  "Carries the \`chore(release): ${VERSION}\` commit from \`${BRANCH}\` back to \`${DEV_BRANCH}\`: the dated CHANGELOG.md section, the reopened \`[Unreleased]\`, and the version bumps in \`debian/changelog\`, the rpm spec and the PKGBUILD." \
                  "Opened automatically because ${reason}. Merge it (do not squash) before adding new notes under \`[Unreleased]\`, otherwise the next back-merge conflicts too.")" \
              >/dev/null 2>&1 || true
            url="$(gh pr view "$head" --json url --jq .url)"
            {
              echo "### Back-merge into \`${DEV_BRANCH}\` needs a hand"
              echo ""
              echo "Could not merge and push directly because ${reason}."
              echo "Review and merge: $url"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Back-merge into ${DEV_BRANCH} left as a pull request: $url"
          }

          if ! git ls-remote --exit-code --heads origin "$DEV_BRANCH" >/dev/null 2>&1; then
            echo "No '${DEV_BRANCH}' branch on origin; nothing to back-merge."
            exit 0
          fi

          git fetch --no-tags origin "+refs/heads/${DEV_BRANCH}:refs/remotes/origin/${DEV_BRANCH}"
          git checkout -B "$DEV_BRANCH" "origin/${DEV_BRANCH}"

          if git merge-base --is-ancestor "$RELEASE_SHA" HEAD; then
            echo "${DEV_BRANCH} already contains ${VERSION}."
            exit 0
          fi

          if ! git merge --no-ff "$RELEASE_SHA" \
                 -m "chore: back-merge ${VERSION} into ${DEV_BRANCH}"; then
            git merge --abort
            open_pr "$RELEASE_SHA" "the merge conflicts with \`${DEV_BRANCH}\`"
            exit 0
          fi

          if ! git push origin "$DEV_BRANCH"; then
            open_pr "$(git rev-parse HEAD)" "the push to \`${DEV_BRANCH}\` was rejected"
            exit 0
          fi

          {
            echo "### \`${VERSION}\` back-merged into \`${DEV_BRANCH}\`"
            echo ""
            echo "The version bumps and the reopened \`[Unreleased]\` are on \`${DEV_BRANCH}\`."
          } >> "$GITHUB_STEP_SUMMARY"
