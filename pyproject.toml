[project]
name = "SecureEye"
version = "0.1.0"
description = "Modern facial authentication for Linux systems (PAM)."
requires-python = ">=3.12"
readme = "README.md"
license = "GPL-2.0-only"
authors = [
	{ name = "Vedran Hrabar", email = "vedran.hrabar@outlook.com" },
]

dependencies = [
	"ffmpeg-python==0.2.0",
	"keras==3.15.0",
	"keyboard==0.13.5",
	"mediapipe==0.10.33",
	"numpy==2.3.4",
	"opencv-contrib-python==4.13.0.92",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
	"pytest==9.1.1",
	"ruff==0.16.0",
	"mypy==2.3.0",
	"numpy==2.3.4",
]

[tool.ruff]
line-length = 100
extend-exclude = ["build", "buildDir", "build-ppa", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "C", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["secureEye/src", "tests"]
mypy_path = ["secureEye/src"]
namespace_packages = false

ignore_missing_imports = true
exclude = '(^|/)(build|buildDir|build-ppa|obj-x86_64-linux-gnu|\.venv)/'

[tool.pytest.ini_options]
markers = [
	"mediapipe_integration: tests that require the real mediapipe package",
]
